name: Playwright Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"   # daily at 6 AM UTC

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: FrontendBackendAutomation   # 👈 this sets the folder for ALL steps

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('FrontendBackendAutomation/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven

      - name: Install Playwright browsers
        run: mvn exec:java -Dexec.args="install"

      - name: Run Playwright tests
        run: mvn test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: FrontendBackendAutomation/target/surefire-reports/
